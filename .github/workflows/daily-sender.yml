name: Daily Automated Email Sender

on:
  schedule:
    # Runs every day at 09:00 AM Sydney time (23:00 UTC)
    - cron: '0 23 * * *'
  # Allows manual triggering from GitHub Actions tab
  workflow_dispatch:
    inputs:
      target_list_id:
        description: 'Mailing List ID to send from (e.g. google-maps-plumbers)'
        required: false
        default: 'google-maps-plumbers'

jobs:
  send-daily-emails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Daily Email Dispatcher (Max 100/day)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || 'WP Pro <hello@email.wppro.com.au>' }}
          RESEND_REPLY_TO: ${{ secrets.RESEND_REPLY_TO || 'info@wppro.au' }}
          TARGET_LIST_ID: ${{ github.event.inputs.target_list_id || 'google-maps-plumbers' }}
        run: npx tsx scripts/github-action-send.ts

      - name: Commit and Push Updated List State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/lists/
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily email send status [skip ci]" && git push)
